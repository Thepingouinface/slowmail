# Publie le site (dossier site/) sur GitHub Pages.
# À activer une fois : Settings > Pages > Build and deployment > Source : « GitHub Actions ».

name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-site.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Construire le site
        run: scripts/build-site.sh "${{ github.repository }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
